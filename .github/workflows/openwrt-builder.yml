name: Build ImmortalWrt for C2000-MAX

on:
  workflow_dispatch:
    inputs:
      configFile:
        description: '配置文件路径'
        required: false
        default: 'config/c2000max.config'

env:
  REPO_BRANCH: v23.05.4
  CONFIG_FILE: ${{ github.event.inputs.configFile || 'config/c2000max.config' }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison git python3 python3-pip unzip libssl-dev libelf-dev

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          cat ${{ env.CONFIG_FILE }} >> .config
          make defconfig

      - name: 下载依赖包
        run: |
          make -j$(nproc) download

      - name: 编译固件
        run: |
          make -j$(nproc)

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C2000-MAX-ImmortalWrt-Firmware
          path: bin/targets/mediatek/filogic/*.bin
